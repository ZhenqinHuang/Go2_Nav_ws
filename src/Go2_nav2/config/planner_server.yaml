planner_server:
  ros__parameters:
    use_sim_time: False
    # 提到 4Hz：动态环境（人走过、家具移动）下全局路径每 0.25s 更新一次
    # NavFn 在 35m×32m 地图 0.05m 分辨率下单次 ~30-50ms，4Hz CPU 占用约 8%
    expected_planner_frequency: 4.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.2
      use_astar: true
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: map
      robot_base_frame: base_link
      # planner 提到 4Hz 后 costmap 也要跟上，否则 planner 跑了等于白跑
      update_frequency: 5.0
      publish_frequency: 2.0
      # 与 local_costmap 保持一致，覆盖 Go2 转弯时的扫掠半径
      robot_radius: 0.25
      # transform_fusion C++ node uses current timestamps; keep this tight so
      # Nav2 does not continue planning against multi-second stale localization.
      transform_tolerance: 1.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/map"
        subscribe_to_updates: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
      # 全局层膨胀与 local 保持一致；过大会让 NavFn 在窄/中等通道找不到路径
      # 0.22m + factor 5.0 让 NavFn 在 0.8m 走廊也能找到中央通道
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.22
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False
