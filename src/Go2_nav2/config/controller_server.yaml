controller_server:
  ros__parameters:
    use_sim_time: False
    # 20Hz 是 Orin NX 单核性能下 DWB 能稳跑的甜区
    # 25Hz 实测会触发 "Control loop missed its desired rate" → 实际反而更慢
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]
    odom_topic: "/odom"
    transform_tolerance: 0.5

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.03
      movement_time_allowance: 60.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 0.15m 对四足太严：FAST-LIO 重定位 + Go2 步态有 ±10cm 抖动，
      # 加上 map->odom 平滑过程，机器狗实际会在目标周围 ±10cm 飘，
      # 15cm 容差经常进了又出 → 反复发新路径
      xy_goal_tolerance: 0.25
      # 0.35rad (20°) 实测停姿明显偏 → 收到 0.18rad (~10°) 平衡精度与摆头
      # Go2 步态原地旋转一步约 0.4rad，0.18 容差落在一步以内但比 0.15 略松
      # 避免步态死区导致反复进出
      yaw_goal_tolerance: 0.18
      stateful: True

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      max_vel_x: 0.60
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.4
      min_speed_xy: 0.0
      max_speed_xy: 0.60
      # Go2 原地旋转时角速度低于 ~0.1 rad/s 步态踩不动，设最低 0.15 保证能转起来
      min_speed_theta: 0.15
      acc_lim_x: 1.2
      decel_lim_x: -1.5
      acc_lim_y: 0.0
      decel_lim_y: 0.0
      acc_lim_theta: 2.5
      decel_lim_theta: -2.5
      # 采样密度：DWB 单次评估 vx_samples × vtheta_samples 条轨迹
      # 20×24=480 条在 Orin NX 单核 20Hz 下能稳跑（25×30=750 会爆）
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 24
      # 1.6s 前瞻：0.35m/s × 1.6s = 0.56m，足够弯道预判，又不会让评分太重
      sim_time: 1.6
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.8
      # 与外层 goal_checker 保持一致；DWB 用这个判断何时切换到 RotateToGoal 阶段
      xy_goal_tolerance: 0.25
      # trans_stopped_velocity：DWB 判断"机器狗已经停下来可以原地转"的阈值
      # Go2 在低速行走时实际 vx 会在 0.05-0.15 之间波动，
      # 设 0.25 让 DWB 更果断地进入 RotateToGoal 阶段
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics:
        - Oscillation
        - BaseObstacle
        - ObstacleFootprint
        - PathDist
        - GoalDist
        - PathAlign
        - GoalAlign
        - RotateToGoal
      BaseObstacle.scale: 20.0
      ObstacleFootprint.scale: 30.0
      PathDist.scale: 16.0
      GoalDist.scale: 20.0
      # PathAlign: 让局部轨迹方向贴合全局路径切向，转弯时提前对齐避免擦墙角
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.20
      # GoalAlign: 接近目标时引导航向对齐，权重适中避免过度摆头
      GoalAlign.scale: 16.0
      GoalAlign.forward_point_distance: 0.1
      # RotateToGoal: 接近目标后原地旋转到目标 yaw
      # scale 32：权重加大让 DWB 掉头时更果断，不被 PathDist 拉着往前走
      # slowing_factor 2.0：从 5.0 降低。原来接近目标 yaw 时角速度被除以 5，
      # Go2 步态死区大约 0.1 rad/s，5 倍减速后直接踩不动 → "掉不过来"
      # 1.5 倍减速在 max_vel_theta=1.4 下接近目标时仍有 ~0.93 rad/s 能力，掉头更果断
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 1.5
      RotateToGoal.lookahead_time: -1.0
      # Oscillation: 原地旋转时 vx≈0，原来 threshold=0.05 会把正常旋转判为振荡
      # 抬到 0.10 让 DWB 在低 vx 时不惩罚旋转轨迹
      Oscillation.x_only_threshold: 0.10

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: base_link
      # costmap 频率必须 ≥ controller_frequency，否则 DWB 永远拿到滞后的代价图
      update_frequency: 18.0
      publish_frequency: 5.0
      rolling_window: True
      # 5x5m rolling window：折中值。机器狗在中心，前后左右各 2.5m 覆盖
      # 比 4m 多 25% 边距用于弯道预判，比 6m 评分快约 30%
      width: 5
      height: 5
      resolution: 0.05
      # Go2 实际外形 0.70m × 0.31m，长条矩形——用 footprint 多边形比圆形 robot_radius
      # 物理上更准：圆形 0.25 在两侧吃掉 0.25m，让窄通道误判无路。
      # 矩形 footprint：纵向 ±0.35m（覆盖前后扫掠），横向 ±0.155m（实际车身宽度）。
      # 0.6m 宽走廊里中央仍剩 0.29m 自由空间，狗能稳过。
      footprint: "[[0.35, 0.155], [0.35, -0.155], [-0.35, -0.155], [-0.35, 0.155]]"
      transform_tolerance: 0.8
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
      # 膨胀参数权衡：
      # - 太大 → 窄/中等通道里机器狗整个泡在高代价区，DWB 评分认为"无路可走"
      #          + cost_regulated 减速到 < 步态死区 → 直接踩不动卡住
      # - 太小 → 转弯擦墙角
      # 0.22m 膨胀仅比 robot_radius 0.25m 略小（致命半径已覆盖核心）
      # cost_scaling_factor 5.0 让代价快速衰减：墙边 0.05m 内为高代价，
      # 之外迅速归零 → 0.8m 走廊里中央 0.6m 都是 0 代价，DWB 自由发挥
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.22
