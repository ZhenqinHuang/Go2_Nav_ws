[global]
# PTP 域编号
domainNumber          0

# 本机作为 Master，设置较高优先级
priority1             128
priority2             128

# 时钟类型：ordinary clock
clockClass            135
clockAccuracy         0xFE
offsetScaledLogVariance 0xFFFF

# 传输层：UDPv4
network_transport     UDPv4

# 延迟机制：端到端
delay_mechanism       E2E

# 时间戳类型：software（eth0 不支持硬件时间戳）
time_stamping         software

# 同步间隔（2^n 秒）
logSyncInterval       0
logAnnounceInterval   1
logMinDelayReqInterval 0
announceReceiptTimeout 3

# 步进模式：one-step（单步）
twoStepFlag           1

# 从系统时钟同步（本机作为 Master 时使用系统时钟）
free_running          0
freq_est_interval     1

# 日志级别（0=最详细，7=最简洁）
logging_level         6
verbose               0

# 统计输出
summary_interval      0

[eth0]
# 此处接口名会被启动脚本动态替换
