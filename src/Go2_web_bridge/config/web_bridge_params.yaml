# Go2_web_bridge 参数配置
#
# ⚠️ 注意：当前 web_bridge.launch.py 不加载本 yaml 文件，
#         所有参数通过 LaunchArgument 从 run_web_bridge.sh 传入，
#         实际生效的 SERVER_URL 在 run_web_bridge.sh:27 和
#         web_bridge.launch.py:28（两处必须保持一致）。
#         本 yaml 当前仅作为参数清单/默认值参考，改这里不会生效。
#
web_bridge_node:
  ros__parameters:
    # WebSocket 服务器地址（含鉴权 token 和 source_id）
    # 与 run_web_bridge.sh / web_bridge.launch.py 默认值保持一致
    # 注意：服务方实际在 IP:30100 跑 ws 服务，域名 wss://jqg.yihexiaozhong.com
    # 默认 443 端口未提供 wss 服务（实测被对端 reset），必须用 IP+30100
    server_url: "ws://121.40.212.85:30100/ws/source?token=c7e4a9d2b5f1c8e3a6d4b7f2c9a1e5d8&source_id=dog_001"

    # 订阅话题
    odom_topic: "/odom"
    localization_topic: "/localization"

    # 上报频率（Hz）
    odom_publish_hz: 2.0        # 里程计：2 Hz（带宽敏感，可降低）
    nav_status_publish_hz: 1.0  # 导航状态：1 Hz

    # 断线重连等待时间（秒）
    reconnect_delay_sec: 5.0
