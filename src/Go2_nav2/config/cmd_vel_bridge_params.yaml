go2_cmd_vel_bridge:
  ros__parameters:
    # Nav2 输出的 cmd_vel 话题
    cmd_vel_topic: "/cmd_vel"

    # 速度限幅（Go2 运动模式下的安全上限）
    max_vx: 0.35       # 前进最大速度 m/s（与 controller_server.yaml 的 max_vel_x 一致）
    max_vy: 0.0        # Go2 不支持横向移动，保持 0
    max_vyaw: 1.0      # 最大转速 rad/s（与 max_vel_theta 一致）

    # 死区：低于此值视为零速，避免微小抖动驱动机器人
    motion_deadband: 0.03

    # cmd_vel 超时：超过此时间未收到新指令则停止运动
    # controller 偶尔抖动到 4-5Hz 时，0.35s 会被频繁触发导致一卡一卡，放宽到 0.6s
    cmd_timeout_sec: 0.6

    # 控制循环频率（Hz），建议与 controller_frequency 相近或更高
    publish_rate_hz: 50.0

    # 收到非零 cmd_vel 时自动发送 StandUp 指令（导航前机器人需处于站立状态）
    stand_up_on_motion: true
    # StandUp 后等待稳定的时间（s），稳定后再开始移动
    stand_up_settle_sec: 0.6
    # 启动时立即发送 StandUp（false = 等到有运动指令时再站起）
    auto_stand_up: false

    # 定位健康保护：仅 Nav2 bridge 默认启用；键盘遥控通过 ros2 run 启动时默认不启用
    localization_guard_enabled: true
    localization_topic: "/map_to_odom"
    # /map_to_odom 目标 1.5 Hz；超过约两个周期未更新就暂停执行层。
    localization_timeout_sec: 1.5
    # ICP max_delta 放宽到 0.8m/1.05rad 后，正常修正幅度会更大
    # 暂停阈值设在 max_delta 的 60-70%，只在大堂等开阔场景的大幅锁回时触发
    # pause_sec 给 transform_fusion 的 yaw 平滑常数 (1.0s) 留时间收敛
    correction_pause_sec: 0.8
    correction_pause_delta_xy: 0.50
    correction_pause_delta_yaw: 0.70

    # 角速度 EMA 新指令权重（1=无平滑，越小越平滑但越滞后）
    # 0.65 在环岛连续转弯时会让角速度爬升过慢、显得犹豫；0.85 更跟手
    vyaw_smooth_alpha: 0.85
