pcd_to_occupancy:
    ros__parameters:
        # ============================================================
        # pcd_to_map 参数配置
        # 应用场景：Go2 机器狗在约 70 平米室内店铺自主导航
        # 功能：将 FAST-LIO2 保存的 PCD 点云转换为 2D 占据栅格地图
        # ============================================================

        # ── 输入输出 ─────────────────────────────────────────────────
        # pcd_file: PCD 文件的绝对路径
        pcd_file: "/home/nvidia/Go2_Nav_ws/maps/MID360.pcd"

        # output_path: 输出地图的路径前缀（不含扩展名），留空则不保存文件
        # 生成 <output_path>.pgm 和 <output_path>.yaml
        output_path: "/home/nvidia/Go2_Nav_ws/maps/MID360_map"

        # ── 栅格分辨率 ────────────────────────────────────────────────
        # 0.05 m/cell 在 70 平米室内精度足够，与 Nav2 代价地图默认分辨率一致
        resolution: 0.05

        # ── 高度过滤 ──────────────────────────────────────────────────
        # PCD 是 FAST-LIO /cloud_registered 输出，已变换到世界坐标系（map frame）
        # Z 值即绝对高度，地面 = Z≈0，与雷达安装角度无关
        #
        # 点云 Z 分布分析：
        #   Z < 0.0 : 16.9%  地面以下（SLAM漂移/地面穿透噪点）
        #   0.0~0.3 : 11.0%  地面反射，需过滤
        #   0.3~2.0 : 43.4%  障碍物主体（低矮物体+墙壁）
        #   > 2.0   : 天花板及以上
        #
        # 雷达安装高度 0.14m，低矮障碍物从约 0.3m 开始有足够点密度
        z_min: 0.3
        z_max: 2.0

        # ── 地图边界填充 ──────────────────────────────────────────────
        padding: 1.0

        # ── 统计去噪 (StatisticalOutlierRemoval) ─────────────────────
        # sor_mean_k: 邻居点数，越大去噪越强但越慢
        # sor_stddev: 标准差倍数，越小去噪越激进
        sor_mean_k: 50
        sor_stddev: 0.8

        # ── 障碍物判定阈值 ────────────────────────────────────────────
        # 地面已由 z_min 过滤，threshold 只需过滤稀疏飞点
        # threshold=3：保留所有有 3 个以上点的栅格，墙壁完整性好
        # 如果噪点仍多可升到 4
        hit_threshold: 4
