# Go2_web_bridge 参数配置
web_bridge_node:
  ros__parameters:
    # WebSocket 服务器地址（含鉴权 token 和 source_id）
    server_url: "wss://jqg.yihexiaozhong.com/ws/source?token=c7e4a9d2b5f1c8e3a6d4b7f2c9a1e5d8&source_id=dog_001"

    # 订阅话题
    odom_topic: "/odom"
    localization_topic: "/localization"

    # 上报频率（Hz）
    odom_publish_hz: 2.0        # 里程计：2 Hz（带宽敏感，可降低）
    nav_status_publish_hz: 1.0  # 导航状态：1 Hz

    # 断线重连等待时间（秒）
    reconnect_delay_sec: 5.0
