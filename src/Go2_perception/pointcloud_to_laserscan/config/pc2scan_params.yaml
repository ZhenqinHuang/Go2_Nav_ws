/**:
    ros__parameters:
        # ============================================================
        # pointcloud_to_laserscan 参数配置
        # 应用场景：Go2 机器狗在约 70 平米室内店铺自主导航
        # 上游输入：go2_pc2scan/cloud_filter_node 过滤后的点云
        # ============================================================

        # ── 输入输出话题 ─────────────────────────────────────────────
        # 注意：pointcloud_to_laserscan 节点的话题通过 launch 文件 remap 设定
        # 此处仅设置算法参数

        # ── 坐标帧 ──────────────────────────────────────────────────
        # target_frame 为空字符串时使用点云自带 frame_id（即 base_link/body）
        # 若需要在 odom 或 map 帧生成 scan，填对应 frame_id
        target_frame: ""       # 空 = 使用点云原始坐标系（base_link）
        transform_tolerance: 0.05  # TF 查询容差 (s)

        # ── 投影范围 ─────────────────────────────────────────────────
        # 注意：这里的范围是 cloud_filter_node 输出的点云已经高度过滤过了
        # 此处只需做最终的水平距离截断

        # 最小检测距离 (m)：过滤贴近机体的点（腿部/底盘反射）
        # Go2 机体宽约 0.32 m，设 0.25 m 安全
        min_height: -0.30      # 相对点云 frame_id 的 z 下限（配合 cloud_filter 的切片兜底）
        max_height:  0.50      # 相对点云 frame_id 的 z 上限

        # ── LaserScan 角度范围 ────────────────────────────────────────
        # MID360 水平 360° 全覆盖，保留全范围
        angle_min: -3.14159    # -π
        angle_max:  3.14159    # +π

        # ── 角度分辨率 ────────────────────────────────────────────────
        # 1° 分辨率（0.01745 rad）在 70 平米室内足够，NAV2 代价地图常用分辨率
        # 更高分辨率（0.5°）提升精度但增加计算量；Orin NX 用 1° 即可
        angle_increment: 0.01745  # ~1° in radians

        # ── 扫描时间 ──────────────────────────────────────────────────
        # MID360 点云帧率 10 Hz → 扫描周期 100 ms
        scan_time: 0.1

        # ── 距离范围 ──────────────────────────────────────────────────
        range_min: 0.25    # 最近检测距离 (m)，滤除机体及噪点
        range_max: 12.0    # 最远检测距离 (m)，70平米店铺对角线约 12 m
                           # 超出范围的点用 range_max + epsilon 填充（inf in rviz）

        # ── 并发线程数 ────────────────────────────────────────────────
        # Orin NX 6核，设 2 个线程足够（避免与 FAST-LIO2 争核）
        use_inf: true      # 超出 range_max 的点用 inf 表示（NAV2 兼容）
        inf_epsilon: 1.0   # range_max 之外填入 range_max + 1.0
