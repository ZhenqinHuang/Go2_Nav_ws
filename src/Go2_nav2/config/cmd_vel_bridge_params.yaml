go2_cmd_vel_bridge_node:
  ros__parameters:
    # Nav2 输出的 cmd_vel 话题
    cmd_vel_topic: "/cmd_vel"

    # 速度限幅（Go2 运动模式下的安全上限）
    max_vx: 0.35       # 前进最大速度 m/s（与 controller_server.yaml 的 max_vel_x 一致）
    max_vy: 0.0        # Go2 不支持横向移动，保持 0
    max_vyaw: 0.8      # 最大转速 rad/s（与 max_vel_theta 一致）

    # 死区：低于此值视为零速，避免微小抖动驱动机器人
    motion_deadband: 0.03

    # cmd_vel 超时：超过此时间未收到新指令则停止运动
    cmd_timeout_sec: 0.35

    # 控制循环频率（Hz），建议与 controller_frequency 相近或更高
    publish_rate_hz: 50.0

    # 收到非零 cmd_vel 时自动发送 StandUp 指令（导航前机器人需处于站立状态）
    stand_up_on_motion: true
    # StandUp 后等待稳定的时间（s），稳定后再开始移动
    stand_up_settle_sec: 0.6
    # 启动时立即发送 StandUp（false = 等到有运动指令时再站起）
    auto_stand_up: false

    # 定位健康保护：仅 Nav2 bridge 默认启用；键盘遥控通过 ros2 run 启动时默认不启用
    localization_guard_enabled: true
    localization_topic: "/map_to_odom"
    # /map_to_odom 目标 1.5 Hz，实际频率取决于 ICP 耗时；超过该时间未更新则暂停执行层
    localization_timeout_sec: 2.5
    # 检测到较明显的重定位修正后，暂停一小段时间等待 map->odom 平滑收敛
    # correction_pause_sec 从 1.0 降到 0.4：yaw 融合时间常数已降到 1.2s，
    # 纠正量传播更快，不需要停那么久；1.0s 会导致每次 ICP 纠正后走走停停
    # correction_pause_delta_yaw 从 0.12 调到 0.25：0.12rad(7°) 太敏感，
    # 正常行走的 odom 噪声就能触发暂停
    correction_pause_sec: 0.4
    correction_pause_delta_xy: 0.20
    correction_pause_delta_yaw: 0.25

    # 角速度 EMA 新指令权重（1=无平滑，越小越平滑但越滞后）
    # 默认 0.85 较接近原始指令；0.65 稍强平滑，降低帧间角速度跳变
    vyaw_smooth_alpha: 0.65
