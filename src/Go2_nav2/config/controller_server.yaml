controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]
    odom_topic: "/odom"
    transform_tolerance: 0.5

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.03
      movement_time_allowance: 60.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      stateful: True

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      max_vel_x: 0.35
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      acc_lim_x: 0.8
      decel_lim_x: -0.8
      acc_lim_y: 0.0
      decel_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.8
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.10
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics:
        - Oscillation
        - BaseObstacle
        - ObstacleFootprint
        - PathDist
        - GoalDist
        - PathAlign
        - GoalAlign
        - RotateToGoal
      BaseObstacle.scale: 20.0
      ObstacleFootprint.scale: 30.0
      PathDist.scale: 16.0
      GoalDist.scale: 20.0
      # PathAlign: 让局部轨迹方向贴合全局路径切向，转弯时提前对齐避免擦墙角
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.20
      # GoalAlign: 接近目标时引导航向对齐，权重适中避免过度摆头
      GoalAlign.scale: 16.0
      GoalAlign.forward_point_distance: 0.1
      # RotateToGoal: 接近目标后原地旋转到目标 yaw，速度限制防止剧烈旋转
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      Oscillation.x_only_threshold: 0.05

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 7.0
      publish_frequency: 4.0
      rolling_window: True
      width: 4
      height: 4
      resolution: 0.05
      # Go2 实际外形约 0.70m x 0.31m，按外接圆估到 0.25m，给转弯时车身扫掠留余量
      robot_radius: 0.25
      transform_tolerance: 0.8
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
      # 较平缓的衰减 + 较大的膨胀半径，让墙角周围形成宽阔的渐变高代价区
      # 这样 DWB 评分时会主动远离墙角，而不是擦着过
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.45
