controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]
    odom_topic: "/odom"
    transform_tolerance: 0.5

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.03
      movement_time_allowance: 60.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 与 DWB 配置保持一致，避免切换 controller 时行为不一
      xy_goal_tolerance: 0.25
      # 收紧到 ~10°，与 DWB 配置保持一致
      yaw_goal_tolerance: 0.18
      stateful: True

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # ── 速度上限（与 cmd_vel_bridge 的 max_vx/max_vyaw 保持一致） ──
      desired_linear_vel: 0.60
      max_linear_accel: 1.2
      max_linear_decel: 1.5
      max_angular_accel: 2.5

      # ── Lookahead（前瞻点）─────────────────────────────────────
      # 速度自适应：高速时前瞻远（路径平滑），低速时前瞻近（贴合精度）
      # 但前瞻太近会让 RPP 误判"接近终点"导致压速 → min 不能太小
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.5
      min_lookahead_dist: 0.50
      max_lookahead_dist: 1.20
      # use_velocity_scaled_lookahead_dist=true 时这个值被忽略，留作回退
      lookahead_dist: 0.6

      # ── 速度调节（核心特性）────────────────────────────────────
      # use_regulated_linear_velocity_scaling: 路径曲率大时自动减速
      # 这是解决环岛卡顿的关键：转弯前路径弯了就先慢下来，平滑过弯
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6   # 曲率半径小于此值开始减速
      # Go2 步态死区较大，最低速度 < 0.15 时机器狗几乎原地踱步
      # 把曲率/代价减速的下限抬到 0.20 m/s，确保任何减速场景下都能真实前进
      regulated_linear_scaling_min_speed: 0.20

      # use_cost_regulated_linear_velocity_scaling: 离障碍近时减速
      # 配合 inflation_layer 的代价梯度使用
      use_cost_regulated_linear_velocity_scaling: true
      # 这两个值要和 local_costmap.inflation_layer 的同名参数一致
      inflation_cost_scaling_factor: 5.0
      cost_scaling_dist: 0.22
      cost_scaling_gain: 1.0

      # ── 接近终点减速 ────────────────────────────────────────────
      # 关闭：Foxy 0.4.7 的 RPP 此特性会过早判定"接近目标"导致全程压速
      # 终点减速由 goal_checker + 默认行为处理已经够用
      use_approach_linear_velocity_scaling: false
      min_approach_linear_velocity: 0.20

      # ── 朝向控制 ─────────────────────────────────────────────────
      # 关闭原地旋转：四足边走边转更自然，配合 regulated_linear_velocity_scaling
      # 在曲率大时自动减速，已经能平滑过弯
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.5
      rotate_to_heading_angular_vel: 0.8

      # ── 容差 ────────────────────────────────────────────────────
      transform_tolerance: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: base_link
      # 与 controller_server.yaml (DWB) 保持一致，避免切换 controller 时
      # local_costmap 行为突变
      update_frequency: 18.0
      publish_frequency: 5.0
      rolling_window: True
      width: 5
      height: 5
      resolution: 0.05
      # 与 DWB 配置保持一致：矩形 footprint 比圆形 robot_radius 更贴合 Go2 实际外形
      footprint: "[[0.35, 0.18], [0.35, -0.18], [-0.35, -0.18], [-0.35, 0.18]]"
      transform_tolerance: 0.8
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
      # RPP 的 cost_regulated 减速依赖这一层的代价梯度
      # cost_scaling_factor / inflation_radius 与 RPP 的 cost_scaling_* 必须一致
      # 0.22 + factor 5.0：墙边 0.05m 内高代价，之外快速衰减；走廊中央代价≈0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.22
