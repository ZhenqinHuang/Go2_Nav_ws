/**:
    ros__parameters:
        # ============================================================
        # go2_pc2scan / cloud_filter_node 参数配置
        # ============================================================

        # ── 话题配置 ─────────────────────────────────────────────────
        cloud_in_topic:  "/cloud_registered_body"  # FAST-LIO2 body 坐标系输出
        cloud_out_topic: "/cloud_filtered"          # 过滤后输出，供 pc2scan 使用

        # ── Body 坐标系高度切片 (z 轴向上) ───────────────────────────
        # Go2 站立时 IMU/body 离地约 0.35 m
        # z_min = -0.25 m → 离地 ~0.10 m（过滤地面反射点）
        # z_max = +0.40 m → 离地 ~0.75 m（过滤天花板、顶部遮挡、机身背部）
        #
        # 覆盖的障碍物类型（相对地面高度）：
        #   桌腿/椅腿：0.10 ~ 0.70 m ✓
        #   货架底部：0.10 ~ 0.30 m  ✓
        #   门框/门扇：全高覆盖       ✓（底部切片即可检测）
        #   玻璃展柜：0.10 ~ 0.70 m  ✓
        #   人腿部分：0.10 ~ 0.70 m  ✓（动态障碍）
        z_min: -0.25
        z_max:  0.40

        # ── 水平距离过滤 ─────────────────────────────────────────────
        # range_min: 过滤机体自身反射（腿部、底盘），Go2 宽约 0.32 m
        # range_max: 店铺最大尺寸约 12 m（√(8²+9²) ≈ 12 m for 72 sqm）
        range_min: 0.25
        range_max: 12.0

        # ── 体素降采样 ────────────────────────────────────────────────
        # 在过滤节点做一次轻量降采样，减少传给 pc2scan 的点数
        # 0.05 m 体素 → 在 70 平米室内，最多保留约 20x20x3=1200 个体素
        # 设为 0 禁用降采样
        downsample_voxel: 0.05
